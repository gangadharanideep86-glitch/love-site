<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story 🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  transition:1s;
}

.container{
  text-align:center;
  padding:30px;
  max-width:350px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(15px);
  border-radius:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
  transition:1s;
}

h1{
  margin-bottom:20px;
}

.option{
  margin:12px 0;
  padding:12px;
  border-radius:20px;
  background:white;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.option:hover{
  transform:scale(1.05);
}

.correct{
  background:#ffb6d9;
}

.shake{
  animation:shake 0.4s;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}

/* Scrapbook */

.scrapbook{
  min-height:100vh;
  padding:50px 20px;
  text-align:center;
  animation:fadeIn 1.5s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

.photo{
  width:230px;
  margin:30px auto;
  padding:10px;
  background:white;
  border-radius:15px;
  box-shadow:0 15px 30px rgba(255,105,180,0.3);
}

.photo img{
  width:100%;
  border-radius:10px;
  filter:grayscale(100%);
}

.quote{
  font-style:italic;
  margin-bottom:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:30px;
}

.grid img{
  width:100%;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(255,105,180,0.25);
  filter:grayscale(100%);
}

.ending{
  margin-top:60px;
  font-size:18px;
  font-weight:600;
}

</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

/* Step 1 – Cherry Blossom Mood */
function step1(){
  document.body.style.background = 
  "radial-gradient(circle at 20% 30%, rgba(255,182,193,0.4), transparent 40%), radial-gradient(circle at 80% 70%, rgba(255,105,180,0.3), transparent 40%), linear-gradient(135deg,#ffd6ec,#ffeaf6,#fff5fb)";

  document.getElementById("app").innerHTML=`
    <h1>🌸 Tap the day we became us</h1>
    <div class="option" onclick="checkDate(this,'12')">12/03/2025</div>
    <div class="option" onclick="checkDate(this,'13')">13/03/2025</div>
    <div class="option" onclick="checkDate(this,'14')">14/03/2025</div>
  `;
}

function checkDate(el,val){
  if(val==="13"){
    el.classList.add("correct");
    setTimeout(step2,800);
  }else{
    el.classList.add("shake");
    setTimeout(()=>el.classList.remove("shake"),400);
  }
}

/* Step 2 – Anime Sunset */
function step2(){
  document.body.style.background =
  "linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4)";

  document.getElementById("app").innerHTML=`
    <h1>🌅 Which world stole our evenings?</h1>
    <div class="option" onclick="checkAnime(this,'naruto')">🔥 Naruto</div>
    <div class="option" onclick="checkAnime(this,'one')">🏴‍☠ One Piece</div>
    <div class="option" onclick="checkAnime(this,'ds')">⚔ Demon Slayer</div>
  `;
}

function checkAnime(el,val){
  if(val==="one"){
    el.classList.add("correct");
    setTimeout(step3,800);
  }else{
    el.classList.add("shake");
    setTimeout(()=>el.classList.remove("shake"),400);
  }
}

/* Step 3 – Night Sky Mood */
function step3(){
  document.body.style.background =
  "linear-gradient(135deg,#0f2027,#203a43,#2c5364)";

  document.getElementById("app").innerHTML=`
    <h1 style="color:white;">🌌 Where did time stop for us?</h1>
    <div class="option" onclick="checkPlace(this,'beach')">🏖 Beach</div>
    <div class="option" onclick="checkPlace(this,'balcony')">🏠 Balcony</div>
    <div class="option" onclick="checkPlace(this,'terrace')">🌃 Terrace</div>
  `;
}

function checkPlace(el,val){
  if(val==="terrace"){
    el.classList.add("correct");
    setTimeout(showScrapbook,800);
  }else{
    el.classList.add("shake");
    setTimeout(()=>el.classList.remove("shake"),400);
  }
}

/* Final Scrapbook */
function showScrapbook(){
  document.body.style.overflow="auto";
  document.body.innerHTML=`
  <div class="scrapbook" style="background:linear-gradient(135deg,#ffe6f2,#fff0f8);">

    <div class="photo"><img src="1.jpg"></div>
    <div class="quote">“You are my peaceful place.”</div>

    <div class="photo"><img src="2.jpg"></div>
    <div class="quote">“Loving you feels like home.”</div>

    <div class="photo"><img src="3.jpg"></div>
    <div class="quote">“In your arms, everything fades away.”</div>

    <div class="photo"><img src="4.jpg"></div>
    <div class="quote">“With you, silence is beautiful.”</div>

    <div class="grid">
      <img src="5.jpg">
      <img src="6.jpg">
      <img src="7.jpg">
      <img src="8.jpg">
      <img src="9.jpg">
      <img src="10.jpg">
    </div>

    <div class="ending" style="color:#ff4da6;">
      13/03/2025 — The day our story began 💖
    </div>

  </div>
  `;
}

step1();

</script>

</body>
</html>
