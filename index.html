<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Arc</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.screen{
  text-align:center;
  padding:20px;
}

h1{
  color:#ff4da6;
  text-shadow:0 0 20px #ff4da6;
}

input{
  padding:12px;
  width:220px;
  border-radius:20px;
  border:none;
  margin-top:10px;
}

button{
  margin-top:15px;
  padding:10px 25px;
  border:none;
  border-radius:20px;
  background:#ff4da6;
  color:white;
  cursor:pointer;
}

/* Scrapbook */

.scrapbook{
  background:#f3f1ee;
  min-height:100vh;
  padding:40px 20px;
  color:black;
  font-family:Georgia,serif;
  animation:fadeIn 1.5s ease forwards;
  opacity:0;
}

@keyframes fadeIn{
  to{opacity:1;}
}

.block{
  margin-bottom:60px;
  text-align:center;
}

.photo{
  width:230px;
  background:white;
  padding:10px;
  box-shadow:0 12px 25px rgba(0,0,0,0.2);
  margin:0 auto 20px;
}

.photo img{
  width:100%;
  filter:grayscale(100%);
}

.rotate-left{ transform:rotate(-4deg); }
.rotate-right{ transform:rotate(4deg); }

.note{
  width:260px;
  margin:0 auto;
  background:white;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  font-style:italic;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:40px;
}

.grid img{
  width:100%;
  filter:grayscale(100%);
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.ending{
  text-align:center;
  margin-top:80px;
  font-size:20px;
  font-weight:500;
}

/* Floating hearts */

.hearts{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  top:0;
  left:0;
  overflow:hidden;
}

.hearts span{
  position:absolute;
  font-size:20px;
  color:black;
  animation:rise 8s linear infinite;
}

@keyframes rise{
  0%{bottom:-20px;opacity:0;}
  30%{opacity:1;}
  100%{bottom:100%;opacity:0;}
}

</style>
</head>

<body>

<div id="app" class="screen">
  <h1>🔐 Unlock Our Love Arc</h1>
  <p>When did we officially become us?</p>
  <input id="q1" placeholder="13/03/2025">
  <br>
  <button onclick="check1()">Unlock</button>
</div>

<script>

function check1(){
  const v=document.getElementById("q1").value;
  if(v==="13/03/2025"){
    showQuestion2();
  }else{
    alert("Think again 😉");
  }
}

function showQuestion2(){
  document.getElementById("app").innerHTML=`
    <h1>Round 2</h1>
    <p>Your favourite anime?</p>
    <input id="q2" placeholder="one piece">
    <br>
    <button onclick="check2()">Next</button>
  `;
}

function check2(){
  const v=document.getElementById("q2").value.toLowerCase();
  if(v==="one piece"){
    showQuestion3();
  }else{
    alert("Nope 😏");
  }
}

function showQuestion3(){
  document.getElementById("app").innerHTML=`
    <h1>Final Round</h1>
    <p>Where was our first kiss?</p>
    <input id="q3" placeholder="terrace">
    <br>
    <button onclick="check3()">Unlock Memories</button>
  `;
}

function check3(){
  const v=document.getElementById("q3").value.toLowerCase();
  if(v==="terrace"){
    showScrapbook();
  }else{
    alert("Try again 💖");
  }
}

function showScrapbook(){
  document.body.style.overflow="auto";
  document.body.style.display="block";

  document.body.innerHTML=`
  <div class="hearts">
    <span style="left:20%">♥</span>
    <span style="left:60%">♥</span>
    <span style="left:80%">♥</span>
  </div>

  <div class="scrapbook">

    <div class="block">
      <div class="photo rotate-left"><img src="1.jpg"></div>
      <div class="note">“You are my safe place in this chaotic world.”</div>
    </div>

    <div class="block">
      <div class="photo rotate-right"><img src="2.jpg"></div>
      <div class="note">“Loving you feels like coming home.”</div>
    </div>

    <div class="block">
      <div class="photo rotate-right"><img src="3.jpg"></div>
      <div class="note">“In your arms, I forget every fear.”</div>
    </div>

    <div class="block">
      <div class="photo rotate-left"><img src="4.jpg"></div>
      <div class="note">“With you, even silence feels beautiful.”</div>
    </div>

    <div class="grid">
      <img src="5.jpg">
      <img src="6.jpg">
      <img src="7.jpg">
      <img src="8.jpg">
      <img src="9.jpg">
      <img src="10.jpg">
    </div>

    <div class="ending">
      <p>13/03/2025 — The day “us” began.</p>
      <p>And this is just the beginning of our forever.</p>
    </div>

  </div>
  `;
}

</script>

</body>
</html>
