<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep ❤️ Swati</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body style="margin:0;font-family:Poppins,sans-serif;">

<script>

/* ======================
   STEP 1 – DATE UNLOCK
====================== */

function showUnlock(){
document.body.innerHTML = `
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffe6f2,#ffb3d9,#ff80bf);
  text-align:center;
}
.card{
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 15px 35px rgba(255,105,180,0.3);
}
input{
  padding:12px;
  border-radius:20px;
  border:1px solid #ccc;
  margin-top:10px;
  text-align:center;
}
button{
  margin-top:15px;
  padding:10px 25px;
  border:none;
  border-radius:20px;
  background:#ff4da6;
  color:white;
  cursor:pointer;
}
</style>

<div class="card">
<h2>When did we become us? 💖</h2>
<input id="dateInput" placeholder="DD/MM/YYYY">
<br>
<button onclick="checkDate()">Unlock</button>
<p id="error" style="color:red;"></p>
</div>
`;
}

function checkDate(){
let value = document.getElementById("dateInput").value.trim();
if(value === "13/03/2025"){
showGallery();
}else{
document.getElementById("error").innerText="That’s not our special day 💭";
}
}

/* ======================
   STEP 2 – PHOTO GALLERY
====================== */

function showGallery(){
document.body.style.overflow="auto";
document.body.innerHTML = `
<style>
body{
  margin:0;
  background:linear-gradient(135deg,#fce4ec,#f8bbd0,#f3e5f5);
  text-align:center;
}
h2{
  padding-top:30px;
}
.frame{
  width:220px;
  margin:25px auto;
  padding:12px;
  background:white;
  border-radius:18px;
  box-shadow:0 15px 35px rgba(255,105,180,0.25);
}
.frame img{
  width:100%;
  border-radius:12px;
}
.quote{
  font-style:italic;
  margin-bottom:25px;
  color:#444;
}
</style>

<h2>Our Memories 💕</h2>

<div class="frame"><img src="1.jpg"></div>
<div class="quote">You are my peaceful place.</div>

<div class="frame"><img src="2.jpg"></div>
<div class="quote">Loving you feels like home.</div>

<div class="frame"><img src="3.jpg"></div>
<div class="frame"><img src="4.jpg"></div>
<div class="frame"><img src="5.jpg"></div>
<div class="frame"><img src="6.jpg"></div>
<div class="frame"><img src="7.jpg"></div>
<div class="frame"><img src="8.jpg"></div>
<div class="frame"><img src="9.jpg"></div>
<div class="frame"><img src="10.jpg"></div>

<br><br>
<h3 style="color:#e91e63;">13/03/2025 — Our Story Began 💖</h3>
<br><br>
`;
}

/* AUTO START */
window.onload = function(){
showUnlock();
}

</script>

</body>
</html>
