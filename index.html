<script>

function proposalPage(){

document.body.innerHTML = `
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#ffe6f2,#ffb3d9,#ff66b2);
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  text-align:center;
  color:white;
}
.container{z-index:2;}
.yesBtn{
  padding:25px 60px;
  font-size:28px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
.noBtn{
  position:absolute;
  padding:10px 20px;
  background:#e53935;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>

<div class="container">
<h1>Swati... Will You Marry Me? 💍</h1>
<br>
<button class="yesBtn" onclick="alert('She Said YES 💖')">YES 💖</button>
<button class="noBtn" id="noBtn">No 😅</button>
</div>
`;

moveNoButton();
}

function moveNoButton(){
  const noBtn=document.getElementById("noBtn");
  noBtn.addEventListener("mouseover",()=>{
    noBtn.style.top=Math.random()*80+"vh";
    noBtn.style.left=Math.random()*80+"vw";
  });
}

   PROPOSAL SECTION END
