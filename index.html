<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Our Story 🌸</title>

<style>
body{
  margin:0;
  font-family: 'Poppins', sans-serif;
  background:black;
  color:white;
  text-align:center;
  overflow:hidden;
}

.screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  color:#ff2e88;
  text-shadow:0 0 20px #ff2e88;
}

input{
  padding:12px;
  width:250px;
  border-radius:25px;
  border:none;
  margin-top:15px;
  text-align:center;
}

button{
  margin-top:15px;
  padding:10px 25px;
  border:none;
  border-radius:25px;
  background:#ff2e88;
  color:white;
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 15px #ff2e88;
}

.hidden{
  display:none;
}

/* Sakura petals */
.petal{
  position:absolute;
  color:pink;
  font-size:20px;
  animation:fall 8s linear infinite;
}

@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);}
  100%{transform:translateY(100vh) rotate(360deg);}
}

/* Gallery */
.gallery{
  position:relative;
  width:100%;
  height:100vh;
  background:radial-gradient(circle at top,#ff2e88,#000);
}

.photo{
  position:absolute;
  width:120px;
  border-radius:15px;
  box-shadow:0 0 15px #ff2e88;
  transition:transform 0.3s;
}

.photo:hover{
  transform:scale(1.2);
}

.finalText{
  position:absolute;
  bottom:40px;
  width:100%;
  font-size:18px;
  color:#ff2e88;
  text-shadow:0 0 10px #ff2e88;
}

</style>
</head>

<body>

<div id="game" class="screen">
  <h1>🔐 Unlock Our Love Arc</h1>
  <p id="question">When did we officially become us?</p>
  <input id="answer" placeholder="Type here">
  <button onclick="check()">Unlock</button>
  <div id="error"></div>
</div>

<div id="memory" class="gallery hidden">
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/audio/2022/02/10/audio_25e4d0f3c5.mp3" type="audio/mp3">
  </audio>
  <div class="finalText" id="endingText"></div>
</div>

<script>

let round = 1;

function check(){
  let val = document.getElementById("answer").value.trim().toLowerCase();
  let error = document.getElementById("error");

  if(round===1){
    if(val==="13/03/2025"){
      round=2;
      document.getElementById("question").innerText="Which anime connects us forever?";
      document.getElementById("answer").value="";
      error.innerText="";
    } else error.innerText="Think again 😏";
  }

  else if(round===2){
    if(val==="one piece"){
      round=3;
      document.getElementById("question").innerText="Where was our first kiss? 🌙";
      document.getElementById("answer").value="";
      error.innerText="";
    } else error.innerText="Wrong anime captain 🏴‍☠️";
  }

  else if(round===3){
    if(val==="terrace"){
      unlockGallery();
    } else error.innerText="Close… but not quite 💭";
  }
}

function unlockGallery(){
  document.getElementById("game").classList.add("hidden");
  let memory = document.getElementById("memory");
  memory.classList.remove("hidden");

  document.getElementById("bgMusic").volume=0.4;
  document.getElementById("bgMusic").play();

  for(let i=1;i<=20;i++){
    let img=document.createElement("img");
    img.src=i+".jpg";
    img.className="photo";
    img.style.top=Math.random()*80+"%";
    img.style.left=Math.random()*80+"%";
    img.style.transform="rotate("+(Math.random()*40-20)+"deg)";
    memory.appendChild(img);
  }

  typeEnding();
}

/* Sakura petals */
setInterval(()=>{
  let petal=document.createElement("div");
  petal.className="petal";
  petal.innerHTML="🌸";
  petal.style.left=Math.random()*100+"vw";
  petal.style.fontSize=(Math.random()*20+15)+"px";
  document.body.appendChild(petal);
  setTimeout(()=>petal.remove(),8000);
},500);

/* Anime ending typing */
function typeEnding(){
  const text="13/03/2025 → ∞  Our story has just begun... 💖  To Be Continued 🌸";
  let i=0;
  function typing(){
    if(i<text.length){
      document.getElementById("endingText").innerHTML+=text.charAt(i);
      i++;
      setTimeout(typing,50);
    }
  }
  typing();
}

</script>

</body>
</html>
